<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>☦ NIHIL SINE DEO</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
        }

        body {
            font-family: "Segoe UI", "Trebuchet MS", Arial, sans-serif;
            color: #f5f7ff;

            background:
                radial-gradient(circle at 50% 0%, rgba(42, 78, 150, 0.28), transparent 42%),
                radial-gradient(circle at 15% 85%, rgba(28, 63, 130, 0.14), transparent 35%),
                linear-gradient(145deg, #070b14 0%, #0b1120 48%, #070b14 100%);

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 35px 20px;

            overflow-x: hidden;
        }


        /* LUMINI DISCRETE DE FUNDAL */

        body::before,
        body::after {
            content: "";
            position: fixed;
            pointer-events: none;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.25;
        }

        body::before {
            width: 300px;
            height: 300px;
            background: #244d9b;
            top: -120px;
            left: -100px;
        }

        body::after {
            width: 280px;
            height: 280px;
            background: #163c82;
            bottom: -130px;
            right: -100px;
        }


        /* CONTAINER */

        .container {
            width: 100%;
            max-width: 720px;
            position: relative;
            z-index: 2;

            text-align: center;
        }


        /* SIMBOL */

        .cross {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 42px;
            color: #d8b56a;

            margin-bottom: 14px;

            text-shadow:
                0 0 12px rgba(216, 181, 106, 0.22);

            animation: gentleGlow 4s ease-in-out infinite;
        }


        @keyframes gentleGlow {

            0%,
            100% {
                opacity: 0.88;
            }

            50% {
                opacity: 1;
            }
        }


        /* TITLU */

        h1 {
            margin: 0;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: clamp(30px, 5vw, 43px);

            font-weight: 600;
            letter-spacing: 1.5px;

            color: #f8f9ff;

            text-shadow:
                0 2px 12px rgba(0, 0, 0, 0.45);
        }


        /* SUBTITLU */

        .subtitle {
            margin: 13px auto 35px;

            max-width: 560px;

            font-size: 15px;
            line-height: 1.6;

            color: #aeb8cc;

            letter-spacing: 0.3px;
        }


        /* BUTOANE */

        .sites {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;

            width: 100%;
        }


        .site-button {
            position: relative;

            display: flex;
            align-items: center;

            /*
             * Butonul își ia lățimea după conținut,
             * dar nu depășește containerul.
             */
            width: max-content;
            max-width: 100%;

            min-height: 76px;

            padding: 15px 22px;

            text-decoration: none;

            border-radius: 17px;

            border: 1px solid rgba(119, 153, 214, 0.22);

            background:
                linear-gradient(
                    135deg,
                    rgba(27, 48, 84, 0.96),
                    rgba(14, 27, 51, 0.96)
                );

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.25),
                inset 0 1px 0 rgba(255, 255, 255, 0.035);

            color: #f3f6ff;

            transition:
                transform 0.25s ease,
                border-color 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;

            overflow: hidden;
        }


        /* LINIE LUMINOASĂ */

        .site-button::before {
            content: "";

            position: absolute;

            left: 0;
            top: 0;
            bottom: 0;

            width: 4px;

            background: linear-gradient(
                to bottom,
                #2d67c7,
                #6f94d8
            );

            opacity: 0.9;

            transition:
                width 0.25s ease,
                opacity 0.25s ease;
        }


        /* REFLEX LA HOVER */

        .site-button::after {
            content: "";

            position: absolute;

            top: 0;
            left: -100%;

            width: 70%;
            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255, 255, 255, 0.055),
                    transparent
                );

            transform: skewX(-20deg);

            transition: left 0.6s ease;

            pointer-events: none;
        }


        .site-button:hover {
            transform: translateY(-3px);

            border-color: rgba(101, 150, 232, 0.48);

            background:
                linear-gradient(
                    135deg,
                    rgba(33, 59, 103, 0.98),
                    rgba(16, 32, 60, 0.98)
                );

            box-shadow:
                0 13px 32px rgba(0, 0, 0, 0.36),
                0 0 22px rgba(45, 103, 199, 0.10);
        }


        .site-button:hover::before {
            width: 6px;
            opacity: 1;
        }


        .site-button:hover::after {
            left: 140%;
        }


        .site-button:active {
            transform: translateY(-1px) scale(0.995);
        }


        /* SFÂNTA CRUCE DIN BUTOANE */

        .number {
            flex: 0 0 43px;

            width: 43px;
            height: 43px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin-right: 17px;

            border-radius: 50%;

            background:
                linear-gradient(
                    145deg,
                    rgba(49, 91, 164, 0.55),
                    rgba(23, 48, 91, 0.65)
                );

            border: 1px solid rgba(128, 163, 222, 0.25);

            color: #d8b56a;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            font-size: 22px;

            font-weight: normal;

            line-height: 1;

            text-shadow:
                0 0 8px rgba(216, 181, 106, 0.18);

            box-shadow:
                inset 0 1px 3px rgba(255, 255, 255, 0.04);
        }


        /* TEXT BUTON */

        .button-text {
            flex: 0 0 auto;

            text-align: left;

            font-family:
                "Segoe UI",
                "Trebuchet MS",
                Arial,
                sans-serif;

            font-size: 17px;

            font-weight: 500;

            line-height: 1.4;

            letter-spacing: 0.15px;

            color: #f2f5fc;
        }


        /* SĂGEATĂ */

        .arrow {
            flex: 0 0 auto;

            margin-left: 15px;

            font-size: 24px;

            color: #8eacd9;

            transition:
                transform 0.25s ease,
                color 0.25s ease;
        }


        .site-button:hover .arrow {
            transform: translateX(5px);
            color: #c0d4f5;
        }


        /* FOOTER */

        .footer {
            margin-top: 28px;

            color: #68758b;

            font-size: 12px;

            letter-spacing: 0.6px;
        }


        /* ANIMAȚIE DE APARIȚIE */

        .site-button {
            animation: buttonAppear 0.55s ease both;
        }

        .site-button:nth-child(1) {
            animation-delay: 0.05s;
        }

        .site-button:nth-child(2) {
            animation-delay: 0.10s;
        }

        .site-button:nth-child(3) {
            animation-delay: 0.15s;
        }

        .site-button:nth-child(4) {
            animation-delay: 0.20s;
        }

        .site-button:nth-child(5) {
            animation-delay: 0.25s;
        }


        @keyframes buttonAppear {

            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }


        /* TELEFON / ECRANE MICI */

        @media (max-width: 600px) {

            body {
                padding: 25px 14px;
            }

            .cross {
                font-size: 36px;
            }

            h1 {
                font-size: 30px;
            }

            .subtitle {
                margin-bottom: 27px;
                font-size: 14px;
            }

            .site-button {
                width: auto;
                max-width: 100%;
                min-height: 70px;
                padding: 13px 17px;
                border-radius: 15px;
            }

            .number {
                width: 38px;
                height: 38px;
                flex-basis: 38px;
                margin-right: 13px;
                font-size: 20px;
            }

            .button-text {
                font-size: 15px;
            }

            .arrow {
                font-size: 21px;
                margin-left: 10px;
            }

            .footer {
                margin-top: 22px;
            }
        }


        /* REDUCERE ANIMAȚII */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

    </style>
</head>


<body>

    <main class="container">

        <div class="cross">☦</div>

        <h1>NIHIL SINE DEO</h1>

        <div class="subtitle">
            CREȘTIN - ORTODOX
        </div>


        <div class="sites">


            <!-- 1. OMILIILE SFÂNTULUI IOAN GURĂ DE AUR -->

            <a

            >

                <div class="button-text">

                </div>

            <!-- 2. CATEHISM ORTODOX -->

            <a

            <a

                <div class="number">☦</div>

                <div class="button-text">

                </div>

                <div class="arrow">›</div>

            </a>


            <!-- 4. PARACLISUL MAICII DOMNULUI - MĂNĂSTIRE -->

            <a
                class="site-button"

            >

                <div class="number">☦</div>

            </a>


            <!-- 5. CITEȘTE ORGANIZAT -->

            <a

            >

        </div>


        <div class="footer">

        </div>

    </main>

</body>

</html>
